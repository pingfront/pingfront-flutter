org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The Flutter Gradle plugin (3.47) still uses the variant API of the old DSL, so AGP 9 needs it
# switched back on. AGP then warns on every build about the option and the variant API, both of which
# are Flutter's plugin, not this app; they are suppressed by name.
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE,DEPRECATED_DSL
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
