name: pingfront_revenuecat
description: "The RevenueCat adapter for pingfront_flutter: RevenueCat paywalls as offer cards, and RevenueCat's entitlement as the person's, through the native pingfront adapters."
version: 1.0.0
homepage: https://pingfront.sh
repository: https://github.com/pingfront/pingfront-flutter/tree/main/pingfront_revenuecat
issue_tracker: https://github.com/pingfront/pingfront-flutter/issues
documentation: https://pingfront.sh/docs/flutter
topics:
  - revenuecat
  - paywall
  - subscriptions
  - in-app-purchase
  - chat

environment:
  sdk: ^3.13.4
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  pingfront_flutter: ^1.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: dev.pingfront.flutter.revenuecat
        pluginClass: PingFrontRevenueCatPlugin
      ios:
        pluginClass: PingFrontRevenueCatPlugin
